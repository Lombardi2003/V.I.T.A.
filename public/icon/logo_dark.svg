<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 80" width="380" height="80">
  <defs>
    <style>
      @keyframes ecg-draw {
        0%   { stroke-dashoffset: 420; opacity: 0; }
        8%   { opacity: 1; }
        55%  { stroke-dashoffset: 0; opacity: 1; }
        80%  { stroke-dashoffset: 0; opacity: 1; }
        95%  { stroke-dashoffset: 0; opacity: 0; }
        100% { stroke-dashoffset: 420; opacity: 0; }
      }
      @keyframes ring-out {
        0%   { r: 36; opacity: 0.4; }
        100% { r: 44; opacity: 0; }
      }
      @keyframes breathe {
        0%,100% { transform: scale(1); }
        50%     { transform: scale(1.02); }
      }
      @media (prefers-reduced-motion: no-preference) {
        .ecg   { animation: ecg-draw 3s cubic-bezier(0.4,0,0.6,1) infinite; }
        .ring  { animation: ring-out 3s ease-out infinite; }
        .ring2 { animation: ring-out 3s ease-out 0.55s infinite; }
        .body  { animation: breathe 3s ease-in-out infinite; transform-origin: 40px 40px; }
      }
    </style>
    <clipPath id="c">
      <rect x="7" y="7" width="66" height="66" rx="21"/>
    </clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12b886"/>
      <stop offset="100%" stop-color="#0c8ea0"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00c896"/>
      <stop offset="100%" stop-color="#00a8cc"/>
    </linearGradient>
  </defs>

  <circle class="ring"  cx="40" cy="40" r="36" fill="none" stroke="#12b886" stroke-width="1"/>
  <circle class="ring2" cx="40" cy="40" r="36" fill="none" stroke="#0c8ea0" stroke-width="0.8"/>

  <g class="body">
    <rect x="7" y="7" width="66" height="66" rx="21" fill="url(#bg)"/>
    <rect x="33" y="14" width="13" height="52" rx="5" fill="rgba(255,255,255,0.95)"/>
    <rect x="14" y="33" width="52" height="13" rx="5" fill="rgba(255,255,255,0.95)"/>
    <g clip-path="url(#c)">
      <path class="ecg"
        d="M7,40 L20,40 L25,40 L29,25 L34,56 L37,32 L40,40 L50,40 L54,40 L73,40"
        fill="none" stroke="#0a7a6e" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round"
        stroke-dasharray="420" stroke-dashoffset="420"/>
    </g>
    <rect x="7" y="7" width="66" height="66" rx="21" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  </g>

  <text x="92" y="48"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-weight="700"
        font-size="46"
        letter-spacing="9"
        fill="url(#text-grad)">VITA</text>

  <text x="93" y="66"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-weight="300"
        font-size="10"
        letter-spacing="2.8"
        fill="rgba(255, 255, 255, 0.96)">VIRTUAL INTELLIGENCE TRIAGE ASSISTANT</text>
</svg>